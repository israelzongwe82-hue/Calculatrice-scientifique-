name: Construire la Calculatrice Scientifique Android

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Télécharger le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Installer Android SDK
        uses: android-actions/setup-android@v3

      - name: Configurer Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Installer les dépendances
        run: npm install

      - name: Vérifier la configuration
        run: |
          node --version
          java -version
          npx cap --version

      - name: Préparer les fichiers web
        run: |
          mkdir -p www/images
          cp index.html www/index.html
          if [ -f images/icon.png ]; then
            cp images/icon.png www/images/icon.png
          fi

      - name: Créer le projet Android
        run: npx cap add android

      - name: Synchroniser Android
        run: npx cap sync android

      - name: Construire l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: Calculatrice-Scientifique-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
