name: Construire la Calculatrice Scientifique Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-windows:
    name: Générer l'installateur Windows
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer les dépendances
        run: npm install

      - name: Vérifier les fichiers
        shell: pwsh
        run: |
          if (!(Test-Path "index.html")) {
            throw "Le fichier index.html est introuvable."
          }
          if (!(Test-Path "main.js")) {
            throw "Le fichier main.js est introuvable."
          }
          if (!(Test-Path "images/icon.png")) {
            throw "L'image images/icon.png est introuvable."
          }

      - name: Construire l'installateur Windows
        run: npm run build:win

      - name: Publier l'installateur
        uses: actions/upload-artifact@v4
        with:
          name: Calculatrice-Scientifique-Installateur-Windows
          path: dist/*-setup.exe
          if-no-files-found: error
          retention-days: 7
